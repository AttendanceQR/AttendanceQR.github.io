<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131A2A">
<title>Huddle 25</title>
<style>
:root{--bg:#F4F5F7;--card:#fff;--ink:#131A2A;--muted:#667085;--line:#E4E7EC;--soft:#F0F2F5;
--ok:#1E9E57;--warn:#B76E00;--err:#C0392B;
--g1:#C0392B;--g1s:#FBEAE7;--g2:#2471A3;--g2s:#E6F0F8;--g3:#1E8449;--g3s:#E5F4EB;--g4:#F1C40F;--g4s:#FDF6D8;--g4t:#6B5300}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:28px;height:28px;border-radius:7px;overflow:hidden;flex:none}
.mark i{display:block}.mark i:nth-child(1){background:var(--g1)}.mark i:nth-child(2){background:var(--g2)}.mark i:nth-child(3){background:var(--g4)}.mark i:nth-child(4){background:var(--g3)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#263148}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}.btn.sm{padding:4px 10px;font-size:13px}.btn.big{padding:14px 20px;font-size:17px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;min-width:0}
input:focus,select:focus,.btn:focus-visible{outline:2px solid #6C8CFF;outline-offset:1px}
.gb{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.gb::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.gb.g1{background:var(--g1s);color:var(--g1)}.gb.g2{background:var(--g2s);color:var(--g2)}.gb.g3{background:var(--g3s);color:var(--g3)}.gb.g4{background:var(--g4s);color:var(--g4t)}.gb.g4::before{background:var(--g4)}
.chip{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.chip.ok{background:#E5F4EB;color:var(--ok)}.chip.warn{background:#FFF1D6;color:var(--warn)}.chip.err{background:#FBEAE7;color:var(--err)}.chip.live{background:var(--ok);color:#fff}
/* admin layout */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--soft);color:var(--ink)}
.who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar .grow{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat{border-top:4px solid var(--line)}.stat.g1{border-top-color:var(--g1)}.stat.g2{border-top-color:var(--g2)}.stat.g3{border-top-color:var(--g3)}.stat.g4{border-top-color:var(--g4)}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1;margin-top:4px}.stat span{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}.stat small{color:var(--muted)}
.card h2{font-size:16px;margin-bottom:12px}.sec{margin-bottom:18px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;background:#FAFBFC;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--soft);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover{background:#FAFBFC}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}td.c,th.c{text-align:center}
.mono{font-variant-numeric:tabular-nums;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:38px 16px}.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.prog{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;min-width:90px}.prog i{display:block;height:100%;background:var(--ok)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);flex-wrap:wrap}.row:last-child{border:0}.row .grow{flex:1;min-width:160px}
.sub{color:var(--muted);font-size:13px}
.linkbox{display:flex;gap:8px}.linkbox input{flex:1;font-size:13px;color:var(--muted)}
.note{background:#FFF8E6;border:1px solid #F3DFA8;border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.note.err{background:#FBEAE7;border-color:#F0C4BD}
/* dialogs + toasts */
.modal{position:fixed;inset:0;background:rgba(19,26,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-box.wide{max-width:760px}.modal-box h3{font-size:18px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-err{color:var(--err);font-weight:600;margin:10px 0 0}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}.fg label,.fl{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}.fg .full{grid-column:1/-1}
.grid4{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px;align-items:center;font-size:13px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:grid;gap:8px;z-index:60;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;border-radius:11px;padding:11px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
/* sign-in + scanner */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:400px;text-align:center}
.panel .brand{justify-content:center;font-size:22px;margin-bottom:6px}.panel p{color:var(--muted)}.panel input{width:100%;margin:10px 0;padding:12px;font-size:16px;text-align:center}
.sc{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff}
.sc-top{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.sc-list{padding:14px 16px;display:grid;gap:10px}.sc-list h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.ses{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-left:8px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;cursor:pointer;width:100%}
.ses.g1{border-left-color:var(--g1)}.ses.g2{border-left-color:var(--g2)}.ses.g3{border-left-color:var(--g3)}.ses.g4{border-left-color:var(--g4)}
.ses b{display:block;font-size:16px}.ses .grow{flex:1}.ses.closed{opacity:.5}
.sc-head{display:flex;align-items:center;gap:10px;padding:10px 12px;color:#fff}.sc-head.g1{background:var(--g1)}.sc-head.g2{background:var(--g2)}.sc-head.g3{background:var(--g3)}.sc-head.g4{background:var(--g4);color:#2A2200}
.sc-head button{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}
.sc-head .grow{flex:1;min-width:0}.sc-head b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sc-head small{opacity:.9}
.sc-head .tag{font-weight:800;font-size:13px;border:2px solid currentColor;border-radius:8px;padding:3px 8px;white-space:nowrap}
.cam{position:relative;background:#000;aspect-ratio:1/1;max-height:46vh;overflow:hidden}.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;font-weight:600}
.res{margin:10px 12px 0;border-radius:14px;padding:14px 16px;min-height:104px;display:flex;align-items:center;gap:14px;background:var(--soft);color:var(--muted);font-weight:600}
.res .ico{font-size:38px;line-height:1;flex:none}.res .grow{flex:1;min-width:0}.res .big{font-size:26px;font-weight:800;line-height:1.1;color:inherit}.res .nm{font-size:15px;font-weight:600}.res .why{font-size:14px;font-weight:700;margin-top:2px}
.res.ok.g1{background:var(--g1);color:#fff}.res.ok.g2{background:var(--g2);color:#fff}.res.ok.g3{background:var(--g3);color:#fff}.res.ok.g4{background:var(--g4);color:#2A2200}
.res.dup{background:#FFE7B3;color:#5C3A00}.res.wrong{background:#3B1E6E;color:#fff}.res.bad{background:#FBD9D3;color:#7A1B10}
.res .acts{display:flex;gap:8px;margin-top:8px}.res .acts .btn{color:var(--ink)}
.sc-stats{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 4px;font-weight:600;color:var(--muted)}.sc-stats b{font-size:22px;color:var(--ink)}
.manual{display:flex;gap:8px;padding:6px 12px}.manual input{flex:1;font-size:16px}
.recent{padding:4px 16px 24px}.recent .row{padding:7px 0}
@media(max-width:640px){.fg{grid-template-columns:1fr}.who span{display:none}main{padding:14px 12px 50px}}

</style>
</head>

<script type="module">
/* HUDDLE 25 – Group Management & QR Attendance
   One page, two modes:
     • Admin   – open the page normally and sign in with Google.
     • Scanner – open the staff link (…#k=SECRET). No account needed.
   Data lives in Firebase Firestore; access is enforced by the Firestore security rules. */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, query, where,
  onSnapshot, getDoc, setDoc, writeBatch, serverTimestamp }

// Public identifiers of the Firebase project (not secrets – the security rules protect the data).
const firebaseConfig = {
  apiKey: 'AIzaSyD59k79DM4sxeapRUFymvSGCe7XisaYb7I',
  authDomain: 'huddle25.firebaseapp.com',
  projectId: 'huddle25',
  storageBucket: 'huddle25.firebasestorage.app',
  messagingSenderId: '1089863885771',
  appId: '1:1089863885771:web:b61e1e38858e606f158c4e',
};

const keyMatch = /[#&]k=([A-Za-z0-9_-]+)/.exec(location.hash);
const MODE = keyMatch ? 'scan' : 'admin';
const KEY = keyMatch ? keyMatch[1] : null;

/* ───────────────────────── Firebase (thin wrappers) ───────────────────────── */
// The scanner uses its own named app so testing the staff link never signs the admin out.
const fbApp = MODE === 'scan' ? initializeApp(firebaseConfig, 'scanner') : initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let db;
try { // offline cache: scans are kept on the phone and sent when the connection returns
  db = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) { db = initializeFirestore(fbApp, {}); }
const TS = () => serverTimestamp();

function plain(d) {
  const data = d.data({ serverTimestamps: 'estimate' });
  if (!data) return null;
  const out = { id: d.id, _pending: d.metadata.hasPendingWrites };
  for (const [k, v] of Object.entries(data)) out[k] = v && typeof v.toMillis === 'function' ? v.toMillis() : v;
  return out;
}
const dref = path => doc(db, ...path.split('/'));
const getOnce = async path => plain(await getDoc(dref(path)));
const put = (path, data) => setDoc(dref(path), data);
const watchDoc = (path, cb, err) => onSnapshot(dref(path), { includeMetadataChanges: true }, s => cb(plain(s)), err);
function watchCol(name, cb, err, filter) {
  const q = filter ? query(collection(db, name), where(...filter)) : collection(db, name);
  return onSnapshot(q, { includeMetadataChanges: true }, s => cb(s.docs.map(plain)), err);
}
async function batch(ops) { // ops: [{path, data}]  (data === null → delete)
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    for (const o of ops.slice(i, i + 400)) o.data === null ? b.delete(dref(o.path)) : b.set(dref(o.path), o.data);
    await b.commit();
  }
}

/* ───────────────────────── Helpers ───────────────────────── */
const GROUPS = { 1: 'Red', 2: 'Blue', 3: 'Green', 4: 'Yellow' };
const $ = (s, el = document) => el.querySelector(s);
const root = $('#app');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const badge = g => GROUPS[g] ? `<span class="gb g${g}">Group ${g} · ${GROUPS[g]}</span>` : '<span class="chip">No group</span>';
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtTime = ms => ms ? new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
const fmtDateTime = ms => ms ? new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtDay = d => new Date(d + 'T00:00').toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
const slotKey = s => `${s.date} ${s.start}`;
const slotLabel = s => `${fmtDay(s.date)}, ${s.start}–${s.end}`;
const isLive = s => { const n = new Date(), hm = `${pad(n.getHours())}:${pad(n.getMinutes())}`; return s.date === todayStr() && hm >= s.start && hm <= s.end; };
const brand = sub => `<div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span><div>HUDDLE 25${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>`;
const bySlot = list => [...list].sort((a, b) => slotKey(a).localeCompare(slotKey(b)) || String(a.title).localeCompare(String(b.title), undefined, { numeric: true }));

function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type; t.textContent = msg;
  $('#toasts').append(t); setTimeout(() => t.remove(), type === 'err' ? 6000 : 3200);
}
/** Modal dialog. Resolves to the form values on OK, or null on cancel. `body` is trusted HTML. */
function dialog({ title, body = '', ok = 'OK', cancel = 'Cancel', danger = false, wide = false, validate }) {
  return new Promise(res => {
    const w = document.createElement('div'); w.className = 'modal';
    w.innerHTML = `<form class="modal-box ${wide ? 'wide' : ''}"><h3>${esc(title)}</h3><div>${body}</div><p class="modal-err" hidden></p>
      <div class="modal-actions">${cancel ? `<button type="button" class="btn" data-x>${esc(cancel)}</button>` : ''}
      <button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div></form>`;
    document.body.append(w);
    const f = $('form', w), close = v => { w.remove(); res(v); };

    else cur += c;

  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function downloadCSV(name, rows) {
  // Leading = + - @ are prefixed so spreadsheet apps never treat a cell as a formula.
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* Attendance maths shared by Reports and exports.
   A student counts as present in a time slot if they were scanned at ANY session in that slot. */
function attendanceSummary() {
  const slots = [...new Map(S.sessions.map(s => [slotKey(s), s])).entries()].sort((a, b) => a[0].localeCompare(b[0]));
  const sesSlot = new Map(S.sessions.map(s => [s.id, slotKey(s)]));
  const seen = new Map();
  for (const a of S.att) {
    const k = sesSlot.get(a.sessionId); if (!k) continue;
    if (!seen.has(a.studentId)) seen.set(a.studentId, new Map());
    seen.get(a.studentId).set(k, a);
  }
  const rows = S.students.map(st => {
    const marks = slots.map(([k]) => seen.get(st.id)?.get(k) || null);
    const n = marks.filter(Boolean).length;
    return { st, marks, n, pct: slots.length ? Math.round(n / slots.length * 100) : 0 };
  });
  return { slots, rows };
}

/** Everyone expected at a session, plus anyone from another group recorded there. */
function sessionRows(s) {
  const recs = new Map(attOf(s.id).map(a => [a.studentId, a])), sm = studentMap();
  const rows = S.students.filter(st => st.group === s.group).map(st => ({ st, a: recs.get(st.id) || null }));

  return rows;
}

        <h4>The four sessions</h4><div class="fg">${n.map(i => `<label>Session ${i} name<input name="t${i}" required value="Session ${i}"></label><label>Session ${i} venue<input name="v${i}" required placeholder="Venue"></label>`).join('')}</div>

    // Slot 1: Session 1→Group 1, Session 2→Group 2 …; each later slot every group moves on one session.
    const list = [];
    n.forEach(sl => n.forEach(a => list.push({ title: v['t' + a].trim(), venue: v['v' + a].trim(), date: v['d' + sl], start: v['s' + sl], end: v['e' + sl], group: ((a - sl) % 4 + 4) % 4 + 1, open: true })));
    const okd = await dialog({
      title: 'Check the rotation', wide: true, ok: 'Create 16 sessions',
      body: `${S.sessions.length ? `<div class="note">You already have ${S.sessions.length} session(s). These 16 will be added to them.</div>` : ''}
        <div class="grid4"><span></span>${n.map(a => `<b>${esc(v['t' + a])}<br><span class="sub">${esc(v['v' + a])}</span></b>`).join('')}
        ${n.map(sl => `<span><b>${esc(fmtDay(v['d' + sl]))}</b><br>${esc(v['s' + sl])}–${esc(v['e' + sl])}</span>` + n.map(a => badge(((a - sl) % 4 + 4) % 4 + 1)).join('')).join('')}</div>`,
    });
    if (!okd) return;
    await batch(list.map(s => ({ path: `sessions/${rid(8)}`, data: { ...s, createdAt: TS() } })));
    audit('Schedule created', '16 sessions with rotating groups'); toast('16 sessions created', 'ok');
  },
  async markAtt({ id }) {
    const s = S.sessions.find(x => x.id === F.asid), st = studentMap().get(id); if (!s || !st) return;
    const v = await dialog({ title: 'Mark present', body: `<p><b>${esc(st.reg)}</b> ${esc(st.name)}<br><span class="sub">${esc(s.title)} · ${esc(slotLabel(s))}</span></p><label class="fl">Reason (kept in the change log)<input name="why" required maxlength="120" placeholder="e.g. phone battery dead, verified by ID"></label>`, ok: 'Mark present' });
    if (!v) return;
    await put(`attendance/${s.id}_${st.id}`, { sessionId: s.id, studentId: st.id, group: st.group, wrongVenue: st.group !== s.group, method: 'admin', by: S.user.uid, byName: 'Admin', note: v.why, at: TS() });
    audit('Attendance added by admin', `${st.reg} ${st.name} · ${s.title} ${slotLabel(s)} · ${v.why}`);
  },
  async removeAtt({ id }) {
    const s = S.sessions.find(x => x.id === F.asid), st = studentMap().get(id), a = attOf(F.asid).find(x => x.studentId === id); if (!s || !st || !a) return;
    const v = await dialog({ title: 'Remove this attendance record?', danger: true, ok: 'Remove record', body: `<p><b>${esc(st.reg)}</b> ${esc(st.name)}<br><span class="sub">${esc(s.title)} · recorded ${fmtDateTime(a.at)} by ${esc(a.byName || '?')}</span></p><label class="fl">Reason (kept in the change log)<input name="why" required maxlength="120"></label>` });
    if (!v) return;
    await batch([{ path: `attendance/${a.id}`, data: null }]);
    audit('Attendance removed by admin', `${st.reg} ${st.name} · ${s.title} ${slotLabel(s)} · was recorded ${fmtDateTime(a.at)} by ${a.byName || '?'} (${a.method}) · ${v.why}`);
  },
  exportSession() {
    const s = S.sessions.find(x => x.id === F.asid); if (!s) return;
    downloadCSV(`huddle25-${s.date}-${s.start.replace(':', '')}-${s.title.replace(/[^\w]+/g, '-')}.csv`,
      [['Session', 'Venue', 'Date', 'Time', 'Enrolment No.', 'Name', 'Group', 'Status', 'Wrong venue', 'Scan time', 'Recorded by', 'Method'],
        ...sessionRows(s).map(r => [s.title, s.venue, s.date, `${s.start}-${s.end}`, r.st.reg, r.st.name, GROUPS[r.st.group], r.a ? 'Present' : 'Absent', r.a?.wrongVenue ? 'Yes' : '', r.a ? new Date(r.a.at).toLocaleString() : '', r.a?.byName || '', r.a?.method || ''])]);
  },
  exportReport() {
    const { slots, rows } = attendanceSummary();
    downloadCSV('huddle25-attendance-summary.csv', [['Enrolment No.', 'Name', 'Course', 'Group', ...slots.map(([, s]) => `${s.date} ${s.start}`), 'Attended', 'Slots', 'Percentage'],
      ...rows.filter(r => !F.rg || r.st.group === +F.rg).map(r => [r.st.reg, r.st.name, r.st.course, GROUPS[r.st.group], ...r.marks.map(m => m ? (m.wrongVenue ? 'Present (other venue)' : 'Present') : 'Absent'), r.n, slots.length, r.pct + '%'])]);
  },
  copyLink() { const i = $('#staffLink'); i.select(); navigator.clipboard?.writeText(i.value).then(() => toast('Link copied', 'ok'), () => document.execCommand('copy')); },
  async toggleKey() { await put('private/scannerKey', { key: S.key.key, enabled: !S.key.enabled }); audit(S.key.enabled ? 'Scanning turned off' : 'Scanning turned on', ''); },
  async rotateKey() {
    if (!(await dialog({ title: 'Make a new scanner link?', danger: true, ok: 'Make new link', body: '<p>The current link stops working on every phone straight away. You will need to send the new link to all instructors.</p>' }))) return;
    await put('private/scannerKey', { key: rid(24), enabled: true }); audit('New scanner link made', 'Old link disabled'); toast('New link ready – share it again', 'ok');
  },
  async clearAtt() {
    const v = await dialog({ title: 'Delete ALL attendance records?', danger: true, ok: 'Delete everything', body: `<p>This removes all ${S.att.length} records and cannot be undone. Do this only to clear a trial run.</p><label class="fl">Type DELETE to confirm<input name="c" autocomplete="off"></label>`, validate: v => v.c === 'DELETE' ? '' : 'Type DELETE in capitals to confirm.' });
    if (!v) return;
    const n = S.att.length;
    await batch(S.att.map(a => ({ path: `attendance/${a.id}`, data: null }))); audit('All attendance deleted', `${n} records (test data cleared)`); toast(`${n} records deleted`, 'ok');
  },
};

/** Read, validate, preview and (after confirmation) save the student list. Nothing is dropped silently. */
async function importStudents(e) {
  const file = e.target.files[0]; if (!file) return;
  const rows = parseCSV(await file.text());
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n), need = ['enrolment_no', 'name', 'group_no', 'qr_token'];
  const missing = need.filter(n => col(n) < 0);
  if (missing.length) return dialog({ title: 'This is not the allocation file', cancel: null, body: `<p>Missing column(s): <b>${esc(missing.join(', '))}</b>.</p><p class="sub">Choose “Huddle 25 allocation with QR codes - ADMIN ONLY.csv”.</p>` });
  const errs = [], students = [], regs = new Set(), toks = new Set();
  rows.forEach((r, i) => {
    const g = k => (r[col(k)] ?? '').trim(), ln = i + 2;
    const st = { id: g('enrolment_no').replace(/[^A-Za-z0-9]/g, '').toUpperCase(), reg: g('enrolment_no'), name: g('name').toUpperCase(), title: col('title') < 0 ? '' : g('title'), course: col('course') < 0 ? '' : g('course'), group: +g('group_no'), token: g('qr_token') };
    if (!/^S\/\d\d\/\d{3}$/.test(st.reg)) errs.push(`Row ${ln}: enrolment number “${st.reg}” is not in the form S/25/001`);
    else if (regs.has(st.id)) errs.push(`Row ${ln}: enrolment number ${st.reg} appears twice`);
    if (!st.name) errs.push(`Row ${ln}: missing name`);
    if (![1, 2, 3, 4].includes(st.group)) errs.push(`Row ${ln}: group must be 1–4`);
    if (!/^H25-[0-9A-F]{12}$/.test(st.token)) errs.push(`Row ${ln}: QR code value is missing or malformed`);
    else if (toks.has(st.token)) errs.push(`Row ${ln}: QR code value is used twice`);
    regs.add(st.id); toks.add(st.token); students.push(st);
  });
  if (errs.length || !students.length) return dialog({ title: `Import stopped – ${errs.length || 1} problem(s)`, cancel: null, body: `<p>Nothing was saved. Fix the file and import again.</p><div class="note err">${(errs.length ? errs.slice(0, 12) : ['The file has no students.']).map(esc).join('<br>')}${errs.length > 12 ? `<br>…and ${errs.length - 12} more` : ''}</div>` });
  const cnt = g => students.filter(s => s.group === g).length;
  const okd = await dialog({
    title: `Import ${students.length} students?`, ok: S.students.length ? 'Replace student list' : 'Save students', danger: !!S.students.length,
    body: `<div class="cards" style="grid-template-columns:repeat(4,1fr)">${[1, 2, 3, 4].map(g => `<div class="card stat g${g}"><span>${GROUPS[g]}</span><b>${cnt(g)}</b></div>`).join('')}</div>
      <p class="sub">No problems found in ${esc(file.name)}.</p>
      ${S.students.length ? `<div class="note ${S.att.length ? 'err' : ''}">This replaces the current list of ${S.students.length} students.${S.att.length ? ` <b>${S.att.length} attendance records already exist</b> – only continue if the enrolment numbers are unchanged.` : ''}</div>` : ''}`,
  });
  if (!okd) return;
  await put('roster/main', { students, ids: students.map(s => s.id), count: students.length, updatedAt: TS() });
  audit('Students imported', `${students.length} students from ${file.name}`); toast(`${students.length} students saved`, 'ok');
}

/* ═════════════════════════════ SCANNER ═════════════════════════════ */
const Q = { uid: null, label: '', students: [], tok: new Map(), ids: new Map(), sessions: [], sid: null, att: new Map(), unsubAtt: null, cam: null, last: { x: '', t: 0 }, audio: null, view: '', wrong: null };
try { Q.label = localStorage.getItem('h25_name') || ''; } catch (e) { /* private mode */ }
const curSession = () => Q.sessions.find(s => s.id === Q.sid);
const fatal = (title, text) => { stopCam(); Q.view = 'fatal'; root.innerHTML = `<div class="center"><div class="panel">${brand('Scanner')}<h3 style="margin:14px 0 6px">${esc(title)}</h3><p>${esc(text)}</p><button class="btn big" onclick="location.reload()">Try again</button></div></div>`; };

function scanBoot() {
  root.innerHTML = `<div class="center"><div class="panel">${brand('Scanner')}<p>Connecting…</p></div></div>`;
  onAuthStateChanged(auth, u => {
    if (!u) return void signInAnonymously(auth).catch(e => fatal('Cannot connect', e.message));
    Q.uid = u.uid; Q.label ? register() : askName();
  });
}
function askName() {
  root.innerHTML = `<div class="center"><form class="panel" id="nameForm">${brand('Scanner')}<p>Your name, so the admin can see who scanned.</p>
    <input name="n" required maxlength="40" placeholder="Your name" autocomplete="name"><button class="btn primary big">Continue</button></form></div>`;
  $('#nameForm').onsubmit = e => { e.preventDefault(); Q.label = e.target.n.value.trim().slice(0, 40); if (!Q.label) return; try { localStorage.setItem('h25_name', Q.label); } catch (x) { /* ignore */ } register(); };
}
async function register() {
  try {
    await put(`scanners/${Q.uid}`, { key: KEY, label: Q.label, createdAt: TS() });
    const r = await getOnce('roster/main');
    if (!r?.students?.length) return fatal('Not ready yet', 'The student list has not been loaded by the admin.');
    Q.students = r.students; Q.tok = new Map(r.students.map(s => [s.token, s])); Q.ids = new Map(r.students.map(s => [s.id, s]));
    watchCol('sessions', l => {
      Q.sessions = bySlot(l);
      if (Q.view === 'scan' && !curSession()) { toast('This session was removed', 'err'); showSessions(); }
      else if (Q.view !== 'scan') showSessions();
    }, e => fatal('Connection lost', scanErr(e)));
  } catch (e) { fatal(e.code === 'permission-denied' ? 'This scanner link no longer works' : 'Cannot connect', scanErr(e)); }
}
const scanErr = e => e.code === 'permission-denied' ? 'Ask the Huddle 25 admin for the current scanner link.' : (e.message || 'Check your internet connection.');

function showSessions() {
  stopCam(); Q.unsubAtt?.(); Q.unsubAtt = null; Q.sid = null; Q.view = 'sessions';
  const today = Q.sessions.filter(s => s.date === todayStr()), other = Q.sessions.filter(s => s.date !== todayStr());
  const card = s => `<button class="ses g${s.group} ${s.open ? '' : 'closed'}" data-sid="${esc(s.id)}"><div class="grow"><b>${esc(s.title)}</b><span class="sub">${esc(s.venue)} · ${esc(s.start)}–${esc(s.end)}</span></div>
    ${isLive(s) ? '<span class="chip live">NOW</span>' : ''}${s.open ? '' : '<span class="chip err">Closed</span>'}${badge(s.group)}</button>`;
  root.innerHTML = `<div class="sc"><div class="sc-top">${brand('Scanner · ' + Q.label)}<button class="btn sm" id="rename">Change name</button></div>
    <div class="sc-list">${Q.sessions.length ? '' : '<div class="empty"><b>No sessions yet</b>The admin has not created the sessions.</div>'}
    ${today.length ? '<h3>Today – choose your session</h3>' + today.map(card).join('') : ''}
    ${other.length ? `<h3>${today.length ? 'Other days' : 'Choose your session'}</h3>` + other.map(s => card(s).replace('<span class="sub">', `<span class="sub">${esc(fmtDay(s.date))} · `)).join('') : ''}</div></div>`;
  $('#rename').onclick = askName;
  $('.sc-list').onclick = e => { const b = e.target.closest('[data-sid]'); if (b) openSession(b.dataset.sid); };
}
function openSession(sid) {
  Q.sid = sid; Q.view = 'scan'; Q.att = new Map(); Q.last = { x: '', t: 0 };
  const s = curSession(), exp = Q.students.filter(x => x.group === s.group).length;
  try { Q.audio = Q.audio || new (window.AudioContext || window.webkitAudioContext)(); Q.audio.resume(); } catch (e) { /* no sound */ }
  navigator.wakeLock?.request('screen').catch(() => {});
  root.innerHTML = `<div class="sc"><div class="sc-head g${s.group}"><button id="back">‹ Sessions</button><div class="grow"><b>${esc(s.title)}</b><small>${esc(s.venue)} · ${esc(s.start)}–${esc(s.end)}</small></div><span class="tag">${GROUPS[s.group].toUpperCase()}</span></div>
    <div class="cam"><video id="vid" playsinline muted></video><div class="msg" id="camMsg">Starting camera…</div></div>
    <div class="res" id="res"><div class="ico">📷</div><div class="grow">Point the camera at a student's QR code</div></div>
    <div class="sc-stats"><span><b id="cnt">0</b> / ${exp} present</span><span id="sync"></span></div>
    <form class="manual" id="manual"><input name="r" inputmode="text" autocomplete="off" placeholder="No QR? Type number, e.g. 25/001"><button class="btn">Add</button></form>
    <div class="recent" id="recent"></div></div>`;
  $('#back').onclick = showSessions;
  $('#manual').onsubmit = e => { e.preventDefault(); const v = e.target.r.value; if (v.trim()) { onCode(normReg(v), 'manual'); e.target.r.value = ''; e.target.r.blur(); } };
  $('#res').onclick = e => { const a = e.target.dataset.go; if (a === 'yes' && Q.wrong) record(Q.wrong.st, true, Q.wrong.method); else if (a === 'no') idle(); };
  Q.unsubAtt = watchCol('attendance', l => { Q.att = new Map(l.map(a => [a.studentId, a])); drawCounts(); }, e => toast(scanErr(e), 'err'), ['sessionId', '==', sid]);
  startCam();
}
function normReg(v) { // "25/001", "s25001", "S/25/001", "1" → "S25001"
  let x = v.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (/^\d{1,3}$/.test(x)) x = 'S25' + x.padStart(3, '0'); else if (/^\d{5}$/.test(x)) x = 'S' + x;
  return x;
}
async function startCam() {
  try {
    Q.cam = new QrScanner($('#vid'), r => onCode(r.data, 'qr'), {
      returnDetailedScanResult: true, preferredCamera: 'environment', maxScansPerSecond: 15, highlightScanRegion: true, highlightCodeOutline: true,
      calculateScanRegion: v => { const s = Math.round(Math.min(v.videoWidth, v.videoHeight) * 0.9); return { x: Math.round((v.videoWidth - s) / 2), y: Math.round((v.videoHeight - s) / 2), width: s, height: s, downScaledWidth: 480, downScaledHeight: 480 }; },
    });
    await Q.cam.start(); $('#camMsg')?.remove();
  } catch (e) { const m = $('#camMsg'); if (m) m.textContent = 'Camera not available. Allow camera access for this page in your browser, then reload. You can still type enrolment numbers below.'; }
}
function stopCam() { try { Q.cam?.stop(); Q.cam?.destroy(); } catch (e) { /* ignore */ } Q.cam = null; }
document.addEventListener('visibilitychange', () => { if (MODE === 'scan' && Q.view === 'scan' && !document.hidden) { navigator.wakeLock?.request('screen').catch(() => {}); Q.cam?.start().catch(() => {}); } });

/** Every scan or typed number arrives here. Checked on the phone first so the answer is instant. */
function onCode(text, method) {
  text = String(text).trim(); const now = Date.now(), s = curSession();
  if (!s || Q.view !== 'scan') return;
  if (method === 'qr') { // the same code held in front of the camera counts once
    const same = text === Q.last.x && now - Q.last.t < 3000; Q.last = { x: text, t: now }; if (same) return;
  }
  const st = method === 'qr' ? Q.tok.get(text) : Q.ids.get(text);
  if (!st) return show('bad', '✕', method === 'qr' ? 'Not a Huddle 25 code' : 'Not found', method === 'qr' ? 'This QR is not registered for Huddle 25' : `No student with number ${text}`), fb('err');
  if (!s.open) return show('bad', '🔒', 'Session closed', 'The admin has closed this session'), fb('err');
  const prev = Q.att.get(st.id);
  if (prev) return show('dup', '!', st.reg, st.name, `Already scanned at ${fmtTime(prev.at)}${prev.byName ? ' by ' + prev.byName : ''}`), fb('warn');
  if (st.group !== s.group) {
    const right = Q.sessions.find(x => x.date === s.date && x.start === s.start && x.group === st.group);
    Q.wrong = { st, method };
    show('wrong', '⇄', st.reg, st.name, `Wrong venue – ${GROUPS[st.group]} group${right ? ` should be at ${right.title}, ${right.venue}` : ''}`, '<div class="acts"><button class="btn sm" data-go="yes">Record anyway</button><button class="btn sm" data-go="no">Dismiss</button></div>');
    return fb('err');
  }
  record(st, false, method);
}
function record(st, wrongVenue, method) {
  const s = curSession(); Q.wrong = null; if (!s) return;
  put(`attendance/${s.id}_${st.id}`, { sessionId: s.id, studentId: st.id, group: st.group, wrongVenue, method, by: Q.uid, byName: Q.label, at: TS() })
    .catch(e => { // rejected by the server: someone else recorded this student a moment ago, or the session/link was closed
      toast(e.code === 'permission-denied' ? `${st.reg} was not saved – already recorded on another phone, or scanning is closed.` : `${st.reg} not saved: ${e.message}`, 'err'); fb('err');
    });
  show(`ok g${st.group}`, '✓', st.reg, st.name, `${GROUPS[st.group]} group · recorded ${fmtTime(Date.now())}${wrongVenue ? ' · wrong venue' : ''}`); fb('ok');
}
let resTimer = 0;
function show(cls, ico, big, name, why = '', extra = '') {
  const r = $('#res'); if (!r) return;
  r.className = 'res ' + cls;
  r.innerHTML = `<div class="ico">${ico}</div><div class="grow"><div class="big">${esc(big)}</div><div class="nm">${esc(name)}</div>${why ? `<div class="why">${esc(why)}</div>` : ''}${extra}</div>`;
  clearTimeout(resTimer); if (!cls.startsWith('wrong')) resTimer = setTimeout(idle, 6000);
}
function idle() { Q.wrong = null; const r = $('#res'); if (r) { r.className = 'res'; r.innerHTML = '<div class="ico">📷</div><div class="grow">Ready for the next student</div>'; } }
function fb(kind) { // sound + vibration so the instructor need not look at the screen
  navigator.vibrate?.(kind === 'ok' ? 60 : [90, 60, 90]);
  const ctx = Q.audio; if (!ctx) return;
  const tone = (f, t0, d) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; g.gain.value = 0.15; o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + d); };
  if (kind === 'ok') tone(1040, 0, 0.11); else if (kind === 'warn') { tone(520, 0, 0.12); tone(520, 0.18, 0.12); } else tone(220, 0, 0.35);
}
function drawCounts() {
  if (Q.view !== 'scan') return;
  const s = curSession(), list = [...Q.att.values()].sort((a, b) => b.at - a.at), pend = list.filter(a => a._pending).length;
  $('#cnt').textContent = list.filter(a => !a.wrongVenue).length;
  $('#sync').innerHTML = pend ? `<span class="chip warn">${pend} waiting to save…</span>` : '<span class="chip ok">✓ all saved</span>';
  $('#recent').innerHTML = list.slice(0, 15).map(a => { const st = Q.ids.get(a.studentId); return `<div class="row"><div class="grow"><b class="mono">${esc(st?.reg || a.studentId)}</b> <span class="sub">${esc(st?.name || '')}</span></div>${a.wrongVenue ? '<span class="chip warn">wrong venue</span>' : ''}<span class="sub">${fmtTime(a.at)}${a.by !== Q.uid && a.byName ? ' · ' + esc(a.byName) : ''}</span></div>`; }).join('');
}

/* ───────────────────────── Start ───────────────────────── */
window.__h25ready = true;
MODE === 'scan' ? scanBoot() : adminBoot();

</script>
</body>
</html>
